# tmux side of the tmux-tabs experiment (see ./tmux-tabs); runs on its own server
# (-L ghostty), so plain `tmux` elsewhere is unaffected
source-file -q ~/.config/tmux/tmux.conf

# tab bar; replaces the tokyo-night-tmux status line, which needs bash 4+ and renders
# as a blank single-colour bar on stock macOS
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1f2335,fg=#a9b1d6"
set -g status-left ""
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format "#[bg=#3b4261,fg=#a9b1d6] #I #{b:pane_current_path} #[bg=#1f2335] "
set -g window-status-current-format "#[bg=#7aa2f7,fg=#1f2335,bold] #I #{b:pane_current_path}#{?window_zoomed_flag, 󰊓,} #[bg=#1f2335,nobold] "
# one session per Ghostty window; don't leave it behind when the window closes
set -g destroy-unattached on

# private escape sequences Ghostty sends for the cmd shortcuts
set -s user-keys[0] "\e[5000~"
set -s user-keys[1] "\e[5001~"
set -s user-keys[2] "\e[5002~"
set -s user-keys[3] "\e[5003~"
set -s user-keys[4] "\e[5004~"
set -s user-keys[5] "\e[5005~"
set -s user-keys[6] "\e[5006~"
set -s user-keys[7] "\e[5007~"
set -s user-keys[8] "\e[5008~"
set -s user-keys[9] "\e[5009~"
set -s user-keys[10] "\e[5010~"
set -s user-keys[11] "\e[5011~"
set -s user-keys[12] "\e[5012~"
set -s user-keys[13] "\e[5013~"
set -s user-keys[14] "\e[5014~"

bind -n User0 new-window -c "#{pane_current_path}"
bind -n User1 select-window -t :1
bind -n User2 select-window -t :2
bind -n User3 select-window -t :3
bind -n User4 select-window -t :4
bind -n User5 select-window -t :5
bind -n User6 select-window -t :6
bind -n User7 select-window -t :7
bind -n User8 select-window -t :8
bind -n User9 select-window -t :$
bind -n User10 kill-pane
bind -n User11 previous-window
bind -n User12 next-window
bind -n User13 split-window -h -c "#{pane_current_path}"
bind -n User14 split-window -v -c "#{pane_current_path}"
